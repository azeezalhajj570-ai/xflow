[options]
; =============================================================================
; Odoo 19 Development Configuration
; =============================================================================
; IMPORTANT: This file is mounted into the Odoo container as /etc/odoo/odoo.conf.
; Values here MUST match the project's .env file so that commands run directly
; inside the container (e.g. docker exec odoo19-dev-odoo odoo server ...) work
; without relying on the entrypoint to inject database credentials.
;
; After changing this file, restart the Odoo container:
;   docker compose restart odoo
; =============================================================================

admin_passwd = change-me
proxy_mode = True

; --- Database connection ---
db_host = madarbot-postgres-1
db_port = 5432
db_user = odoo
db_password = change-me
db_maxconn = 64

; dbfilter = .* allows the dev server to see any database (including test DBs).
; The default runtime database is controlled by db_name.  Use -d <dbname> on
; the command line to target a different DB (e.g. test_ai_whatsapp).
dbfilter = ^odoo_2026-08-11_22-38-33$
db_name = odoo_2026-08-11_22-38-33

; --- Addons ---
addons_path = /mnt/custom-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; --- Logging ---
log_handler = :INFO
log_level = info

; --- Workers / limits ---
; workers=4 is appropriate for normal development.  Tests should always run with
; --workers=0 to avoid memory pressure and port conflicts.
workers = 0
max_cron_threads = 1
limit_memory_soft = 1610612736
limit_memory_hard = 2147483648
limit_time_cpu = 60
limit_time_real = 120
limit_request = 8192
server_wide_modules = base,web

; --- Security ---
list_db = False
